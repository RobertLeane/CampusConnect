version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: campusconnect-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection="Server=tcp:campusconnect-server.database.windows.net,1433;Initial Catalog=campusconnect-database;Persist Security Info=False;User ID=campusconnect-server-admin;Password=99Qtt51iWCXW$Mvr;MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
    networks:
      - campusconnect-network

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: campusconnect-client
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - campusconnect-network

networks:
  campusconnect-network:
    driver: bridge
