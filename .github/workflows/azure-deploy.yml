name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AZURE_RESOURCE_GROUP: campusconnect-rg
  AZURE_LOCATION: uksouth

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Create Resource Group
      run: |
        az group create \
          --name ${{ env.AZURE_RESOURCE_GROUP }} \
          --location ${{ env.AZURE_LOCATION }}

    - name: Deploy Bicep template
      uses: azure/arm-deploy@v2
      with:
        resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
        template: ./infra/main.bicep
        parameters: >
          location=${{ env.AZURE_LOCATION }}
          dockerHubUsername=${{ secrets.DOCKERHUB_USERNAME }}
          sqlConnectionString=${{ secrets.SQL_CONNECTION_STRING }}
          sqlAdminLogin=${{ secrets.SQL_ADMIN_LOGIN }}
          sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
          environment=${{ github.event.inputs.environment }}
        failOnStdErr: false

    - name: Get Container Apps URLs
      id: get-urls
      run: |
        API_URL=$(az containerapp show \
          --name campusconnect-api-${{ github.event.inputs.environment }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query properties.configuration.ingress.fqdn -o tsv)
        
        CLIENT_URL=$(az containerapp show \
          --name campusconnect-client-${{ github.event.inputs.environment }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query properties.configuration.ingress.fqdn -o tsv)
        
        echo "api-url=https://$API_URL" >> $GITHUB_OUTPUT
        echo "client-url=https://$CLIENT_URL" >> $GITHUB_OUTPUT

    - name: Test API Endpoint
      run: |
        echo "Testing API at ${{ steps.get-urls.outputs.api-url }}"
        curl -f ${{ steps.get-urls.outputs.api-url }}/api/ping || echo "API health check failed"

    - name: Deployment Summary
      run: |
        echo "## Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### URLs:" >> $GITHUB_STEP_SUMMARY
        echo "- **API**: ${{ steps.get-urls.outputs.api-url }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Client**: ${{ steps.get-urls.outputs.client-url }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Azure Portal:" >> $GITHUB_STEP_SUMMARY
        echo "- [Resource Group](https://portal.azure.com/#@/resource/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.AZURE_RESOURCE_GROUP }})" >> $GITHUB_STEP_SUMMARY
