# Azure DevOps Pipeline for CampusConnect
# Blazor WebAssembly + ASP.NET Core Web API Docker deployment to Azure App Service

trigger:
- main

variables:
  buildConfiguration: 'Release'
  containerRegistry: 'campusconnectregistry.azurecr.io'
  imageName: 'campusconnect'
  imageTag: '$(Build.BuildId)'

pool:
  vmImage: ubuntu-latest

steps:
# Login to Azure and configure ACR permissions
- task: AzureCLI@2
  displayName: 'Configure ACR permissions and build/push Docker image'
  inputs:
    azureSubscription: 'CampusConnect-ServiceConnection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      # Get the service principal ID from the current context
      SERVICE_PRINCIPAL_ID=$(az account show --query user.name -o tsv)
      echo "Service Principal ID: $SERVICE_PRINCIPAL_ID"
      
      # Grant AcrPush role to the service principal for the ACR
      az role assignment create \
        --assignee $SERVICE_PRINCIPAL_ID \
        --role "AcrPush" \
        --scope "/subscriptions/$(az account show --query id -o tsv)/resourceGroups/Software-Tools-Project/providers/Microsoft.ContainerRegistry/registries/campusconnectregistry" \
        || echo "Role assignment may already exist"
      
      # Login to ACR using managed identity
      az acr login --name campusconnectregistry
      
      # Verify project files exist
      echo "Checking project structure..."
      ls -la
      ls -la api/
      ls -la client/
      
      # Build and tag the image
      echo "Building Docker image..."
      docker build -t $(containerRegistry)/$(imageName):$(imageTag) -t $(containerRegistry)/$(imageName):latest .
      
      # Verify image was built
      docker images | grep campusconnect
      
      # Push the images
      echo "Pushing images to ACR..."
      docker push $(containerRegistry)/$(imageName):$(imageTag)
      docker push $(containerRegistry)/$(imageName):latest
      
      echo "Image pushed successfully: $(containerRegistry)/$(imageName):$(imageTag)"

# Deploy Docker container to Azure App Service
- task: AzureWebAppContainer@1
  displayName: 'Deploy to Azure App Service'
  inputs:
    azureSubscription: 'CampusConnect-ServiceConnection'
    appName: 'CampusConnect'
    containers: '$(containerRegistry)/$(imageName):$(imageTag)'