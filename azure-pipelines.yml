# CampusConnect - Blazor WASM + Controllers API
# Deploys to Azure App Service (Linux, .NET 8)

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  resourceGroupName: 'Software-Tools-Project'

steps:
# Install .NET 8 SDK
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'

# Restore dependencies
- script: |
    dotnet restore
  displayName: 'Restore dependencies'

# Build and publish the ASP.NET Core Web API (Server)
- script: |
    dotnet publish ./api -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/publish
  displayName: 'Build and Publish API (Controllers)'

# Build the Blazor WebAssembly Client
- script: |
    dotnet publish ./client -c $(buildConfiguration) -o ./client-publish
  displayName: 'Build Blazor WebAssembly Client'

# Copy Blazor client files into server's wwwroot
- script: |
    mkdir -p $(Build.ArtifactStagingDirectory)/publish/wwwroot
    cp -r ./client-publish/wwwroot/* $(Build.ArtifactStagingDirectory)/publish/wwwroot/
  displayName: 'Integrate Blazor Client into API wwwroot'

# Publish artifact
- task: PublishPipelineArtifact@1
  displayName: 'Publish deployment artifact'
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/publish'
    artifactName: 'drop'

# Before deployment enable Public IP Access
- task: AzureCLI@2
  displayName: 'Enable Public Access'
  inputs:
    azureSubscription: 'CampusConnect-ServiceConnection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az webapp update --name CampusConnect --resource-group $(resourceGroupName) --set publicNetworkAccess=Enabled

# Deploy to Azure App Service
- task: AzureWebApp@1
  displayName: 'Deploy to Azure App Service'
  inputs:
    azureSubscription: 'CampusConnect-ServiceConnection'
    appName: 'CampusConnect'
    appType: 'webAppLinux'
    package: '$(Build.ArtifactStagingDirectory)/publish'
    runtimeStack: 'DOTNETCORE|8.0'
    deploymentMethod: 'auto'

# After deployment disable Public IP Access
- task: AzureCLI@2
  displayName: 'Disable Public Access'
  inputs:
    azureSubscription: 'CampusConnect-ServiceConnection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az webapp update --name CampusConnect --resource-group $(resourceGroupName) --set publicNetworkAccess=Disabled