# Azure DevOps Pipeline for CampusConnect
# Blazor WebAssembly + ASP.NET Core Web API deployment to Azure App Service

trigger:
- main

variables:
  buildConfiguration: 'Release'
  azureServiceConnection: 'CampusConnect-ServiceConnection'
  webAppName: 'CampusConnect'
  resourceGroupName: 'Software-Tools-Project'

pool:
  vmImage: 'ubuntu-latest'

steps:
# Install .NET 8 SDK
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'

# Restore dependencies
- script: |
    dotnet restore
  displayName: 'Restore dependencies'

# Build and publish - Use integrated approach
- script: |
    echo "Building API first..."
    dotnet publish ./api -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/api-temp
    
    echo "Building Blazor WebAssembly with proper hosted configuration..."
    dotnet publish ./client -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/client-temp
    
    echo "=== API Temp Structure ==="
    ls -la $(Build.ArtifactStagingDirectory)/api-temp/ | head -10
    
    echo "=== Client Temp Structure ==="
    ls -la $(Build.ArtifactStagingDirectory)/client-temp/
    
    echo "=== Client wwwroot Structure ==="
    if [ -d "$(Build.ArtifactStagingDirectory)/client-temp/wwwroot" ]; then
        ls -la $(Build.ArtifactStagingDirectory)/client-temp/wwwroot/
        echo "=== _framework Contents ==="
        ls -la $(Build.ArtifactStagingDirectory)/client-temp/wwwroot/_framework/ | head -15
        echo "=== Looking for critical files ==="
        find $(Build.ArtifactStagingDirectory)/client-temp/wwwroot/_framework -name "*.dat" | wc -l
        find $(Build.ArtifactStagingDirectory)/client-temp/wwwroot/_framework -name "*.wasm" | wc -l
    else
        echo "ERROR: Client wwwroot not found!"
        find $(Build.ArtifactStagingDirectory)/client-temp -name "*.wasm" -o -name "*.dat" | head -10
    fi
  displayName: 'Build API and Client Separately'

# Create final integrated package
- script: |
    echo "=== Creating Final Package ==="
    
    # Start with API as base
    mkdir -p $(Build.ArtifactStagingDirectory)/final-package
    cp -r $(Build.ArtifactStagingDirectory)/api-temp/* $(Build.ArtifactStagingDirectory)/final-package/
    
    # Completely replace wwwroot with client's wwwroot
    echo "Replacing API wwwroot with client wwwroot..."
    rm -rf $(Build.ArtifactStagingDirectory)/final-package/wwwroot
    
    if [ -d "$(Build.ArtifactStagingDirectory)/client-temp/wwwroot" ]; then
        # Copy the entire wwwroot directory
        cp -r $(Build.ArtifactStagingDirectory)/client-temp/wwwroot $(Build.ArtifactStagingDirectory)/final-package/
        
        echo "=== Verifying Critical Blazor Files ==="
        echo "Checking for icudt files specifically:"
        ls -la $(Build.ArtifactStagingDirectory)/final-package/wwwroot/_framework/icudt*.dat || echo "ERROR: ICU data files missing!"
        
        echo "Checking for dotnet runtime files:"
        ls -la $(Build.ArtifactStagingDirectory)/final-package/wwwroot/_framework/dotnet*.wasm || echo "ERROR: dotnet runtime missing!"
        
        echo "Checking for blazor.boot.json:"
        ls -la $(Build.ArtifactStagingDirectory)/final-package/wwwroot/_framework/blazor.boot.json || echo "ERROR: blazor.boot.json missing!"
        
        echo "=== Verifying Linux App Service Configuration ==="
        # For Linux App Service, we rely on Program.cs configuration for static files and SPA routing
        echo "Program.cs should contain:"
        echo "  - app.UseStaticFiles()"
        echo "  - app.MapFallbackToFile(\"index.html\")"
        echo "This is configured for Linux hosting, no web.config needed."
        
        # Remove any web.config file that might interfere with Linux hosting
        if [ -f "$(Build.ArtifactStagingDirectory)/final-package/web.config" ]; then
            echo "Removing web.config (not needed for Linux App Service)"
            rm $(Build.ArtifactStagingDirectory)/final-package/web.config
        fi
        
        echo "=== Complete Verification ==="
        echo "Final package wwwroot:"
        ls -la $(Build.ArtifactStagingDirectory)/final-package/wwwroot/
        
        echo "_framework directory (first 15 files):"
        ls -la $(Build.ArtifactStagingDirectory)/final-package/wwwroot/_framework/ | head -15
        
        echo "Critical files count:"
        echo "DAT files: $(find $(Build.ArtifactStagingDirectory)/final-package/wwwroot/_framework -name "*.dat" | wc -l)"
        echo "WASM files: $(find $(Build.ArtifactStagingDirectory)/final-package/wwwroot/_framework -name "*.wasm" | wc -l)"
        echo "JS files: $(find $(Build.ArtifactStagingDirectory)/final-package/wwwroot/_framework -name "*.js" | wc -l)"
        
        # Verify file permissions are correct
        echo "=== File Permissions Check ==="
        echo "Checking permissions on critical files:"
        ls -la $(Build.ArtifactStagingDirectory)/final-package/wwwroot/_framework/icudt_EFIGS.dat || echo "icudt_EFIGS.dat not found"
        ls -la $(Build.ArtifactStagingDirectory)/final-package/wwwroot/_framework/blazor.webassembly.js || echo "blazor.webassembly.js not found"
        
        # Check total size to ensure files aren't corrupted
        echo "=== Size Verification ==="
        echo "Total _framework size:"
        du -sh $(Build.ArtifactStagingDirectory)/final-package/wwwroot/_framework/
        
        # Final verification that all expected files exist
        EXPECTED_FILES=(
            "$(Build.ArtifactStagingDirectory)/final-package/wwwroot/_framework/icudt_EFIGS.dat"
            "$(Build.ArtifactStagingDirectory)/final-package/wwwroot/_framework/icudt_CJK.dat"
            "$(Build.ArtifactStagingDirectory)/final-package/wwwroot/_framework/icudt_no_CJK.dat"
            "$(Build.ArtifactStagingDirectory)/final-package/wwwroot/_framework/blazor.webassembly.js"
            "$(Build.ArtifactStagingDirectory)/final-package/wwwroot/_framework/blazor.boot.json"
        )
        
        echo "=== Final File Existence Check ==="
        for file in "${EXPECTED_FILES[@]}"; do
            if [ -f "$file" ]; then
                echo "✅ Found: $(basename $file)"
            else
                echo "❌ Missing: $(basename $file)"
            fi
        done
        
    else
        echo "FATAL ERROR: Client wwwroot directory not found!"
        exit 1
    fi
    
    echo "=== Final Package Root Files ==="
    ls -la $(Build.ArtifactStagingDirectory)/final-package/
  displayName: 'Create Final Integrated Package'

# Publish artifact
- task: PublishPipelineArtifact@1
  displayName: 'Publish deployment artifact'
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/final-package'
    artifactName: 'drop'

# Deploy to Azure App Service
- task: AzureWebApp@1
  displayName: 'Deploy to Azure App Service'
  timeoutInMinutes: 10
  inputs:
    azureSubscription: 'CampusConnect-ServiceConnection'
    appName: 'CampusConnect'
    appType: 'webAppLinux'
    package: '$(Build.ArtifactStagingDirectory)/final-package'
    runtimeStack: 'DOTNETCORE|8.0'
    deploymentMethod: 'runFromPackage'

# Verify critical files are accessible
- script: |
    echo "=== Post-Deployment Verification ==="
    APP_URL="https://campusconnect-a5gmchashpf4ajem.uksouth-01.azurewebsites.net"
    
    # Test critical Blazor WebAssembly files
    echo "Testing critical Blazor files:"
    
    echo "1. Testing icudt_EFIGS.dat..."
    curl -I "$APP_URL/_framework/icudt_EFIGS.dat" || echo "❌ icudt_EFIGS.dat not accessible"
    
    echo "2. Testing blazor.webassembly.js..."
    curl -I "$APP_URL/_framework/blazor.webassembly.js" || echo "❌ blazor.webassembly.js not accessible"
    
    echo "3. Testing blazor.boot.json..."
    curl -I "$APP_URL/_framework/blazor.boot.json" || echo "❌ blazor.boot.json not accessible"
    
    echo "4. Testing index.html..."
    curl -I "$APP_URL/" || echo "❌ Index page not accessible"
    
    echo "5. Testing API endpoint..."
    curl -I "$APP_URL/api/ping" || echo "❌ API not accessible"
    
    echo "=== File Access Test Complete ==="
  displayName: 'Verify Deployed Files Are Accessible'