# Azure DevOps Pipeline for CampusConnect
# Build and test Blazor WebAssembly + ASP.NET Core Web API

trigger:
- main

variables:
  buildConfiguration: 'Release'

pool:
  vmImage: ubuntu-latest

steps:
# Install .NET 8 SDK
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'
    performMultiLevelLookup: true

# Verify .NET version
- script: |
    dotnet --version
    dotnet --list-sdks
  displayName: 'Verify .NET SDK version'

# Restore dependencies
- task: DotNetCoreCLI@2
  displayName: 'Restore dependencies'
  inputs:
    command: 'restore'
    projects: '**/*.csproj'

# Build API project
- task: DotNetCoreCLI@2
  displayName: 'Build API'
  inputs:
    command: 'build'
    projects: 'api/api.csproj'
    arguments: '--configuration $(buildConfiguration)'

# Build Blazor Client project
- task: DotNetCoreCLI@2
  displayName: 'Build Blazor Client'
  inputs:
    command: 'build'
    projects: 'client/Client.csproj'
    arguments: '--configuration $(buildConfiguration)'

# Run tests with code coverage
- task: DotNetCoreCLI@2
  displayName: 'Run Tests with Code Coverage'
  inputs:
    command: 'test'
    projects: 'CampusConnect_Tests/CampusConnect_Tests.csproj'
    arguments: '--configuration $(buildConfiguration) --collect:"XPlat Code Coverage" --results-directory $(Agent.TempDirectory)/TestResults'
    publishTestResults: true

# Install ReportGenerator tool
- task: DotNetCoreCLI@2
  displayName: 'Install ReportGenerator'
  inputs:
    command: 'custom'
    custom: 'tool'
    arguments: 'install --global dotnet-reportgenerator-globaltool'

# Generate Code Coverage Report
- script: |
    reportgenerator -reports:$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml -targetdir:$(Agent.TempDirectory)/CoverageReport -reporttypes:"HtmlInline_AzurePipelines;Cobertura;Badges"
  displayName: 'Generate Code Coverage Report'

# Publish Code Coverage Results
- task: PublishCodeCoverageResults@2
  displayName: 'Publish Code Coverage'
  inputs:
    codeCoverageTool: 'Cobertura'
    summaryFileLocation: '$(Agent.TempDirectory)/CoverageReport/Cobertura.xml'
    reportDirectory: '$(Agent.TempDirectory)/CoverageReport'
    failIfCoverageEmpty: false

    