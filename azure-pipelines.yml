# Azure Static Web Apps - CampusConnect
# Build and deploy Blazor WebAssembly client and Azure Functions API

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

steps:
# Install .NET 8 SDK
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'

# Restore and build the Blazor client
- script: |
    dotnet restore ./client
    dotnet clean ./client
    dotnet publish ./client -c $(buildConfiguration) --no-restore -o ./client-publish
  displayName: 'Clean, Build and Publish Blazor WebAssembly client'

# Restore and build the Azure Functions API
- script: |
    dotnet restore ./api
    dotnet build ./api -c $(buildConfiguration) --no-restore
  displayName: 'Build Azure Functions API'

# Publish the Azure Functions API
- script: |
    dotnet publish ./api -c $(buildConfiguration) --no-build -o $(Build.ArtifactStagingDirectory)/api
  displayName: 'Publish Azure Functions API'

# Install Node.js for SWA CLI
- task: NodeTool@0
  displayName: 'Install Node.js'
  inputs:
    versionSpec: '18.x'

# Install Static Web Apps CLI
- script: |
    npm install -g @azure/static-web-apps-cli
  displayName: 'Install SWA CLI'

# Debug: List the published content
- script: |
    echo "Contents of client-publish directory:"
    ls -la ./client-publish/
    echo "Contents of wwwroot directory:"
    ls -la ./client-publish/wwwroot/
    echo "Check if Home.razor changes are reflected in the published files:"
    find ./client-publish -name "*.dll" -o -name "*.json" -o -name "*.wasm" | head -10
  displayName: 'Debug: Check published content'

# Deploy to Azure Static Web Apps using SWA CLI
- script: |
    swa deploy ./client-publish/wwwroot --api-location ./api --deployment-token $(AZURE_STATIC_WEB_APPS_API_TOKEN) --env production --verbose
  displayName: 'Deploy to Azure Static Web Apps'
