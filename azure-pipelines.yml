# Azure DevOps Pipeline for CampusConnect
# Build and test Blazor WebAssembly + ASP.NET Core Web API

trigger:
- main

variables:
  buildConfiguration: 'Release'

pool:
  vmImage: ubuntu-latest

steps:
# Install .NET 8 SDK
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'
    performMultiLevelLookup: true

# Verify .NET version
- script: |
    dotnet --version
    dotnet --list-sdks
  displayName: 'Verify .NET SDK version'

# Restore dependencies
- task: DotNetCoreCLI@2
  displayName: 'Restore dependencies'
  inputs:
    command: 'restore'
    projects: '**/*.csproj'

# Build API project
- task: DotNetCoreCLI@2
  displayName: 'Build API'
  inputs:
    command: 'build'
    projects: 'api/api.csproj'
    arguments: '--configuration $(buildConfiguration)'

# Build Blazor Client project
- task: DotNetCoreCLI@2
  displayName: 'Build Blazor Client'
  inputs:
    command: 'build'
    projects: 'client/Client.csproj'
    arguments: '--configuration $(buildConfiguration)'

# Run tests
- task: DotNetCoreCLI@2
  displayName: 'Run Tests'
  inputs:
    command: 'test'
    projects: 'CampusConnect_Tests/CampusConnect_Tests.csproj'
    arguments: '--configuration $(buildConfiguration)'
    publishTestResults: true
    testResultsFormat: 'VSTest'

    