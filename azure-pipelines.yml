# Azure DevOps Pipeline for CampusConnect
# Blazor WebAssembly + ASP.NET Core Web API deployment to Azure App Service

trigger:
- main

variables:
  buildConfiguration: 'Release'

pool:
  vmImage: ubuntu-latest

steps:
# Install .NET 8 SDK
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'

# Restore dependencies
- task: DotNetCoreCLI@2
  displayName: 'Restore dependencies'
  inputs:
    command: 'restore'
    projects: '**/*.csproj'

# Publish API project (this will be the main app)
- task: DotNetCoreCLI@2
  displayName: 'Publish API'
  inputs:
    command: 'publish'
    projects: './api/api.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/api'
    publishWebProjects: false
    zipAfterPublish: false

# Publish Blazor WebAssembly client
- task: DotNetCoreCLI@2
  displayName: 'Publish Blazor Client'
  inputs:
    command: 'publish'
    projects: './client/Client.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/client'
    publishWebProjects: false
    zipAfterPublish: false

# Integrate Blazor client into API wwwroot
- script: |
    echo "Integrating Blazor WebAssembly with API..."
    
    # Remove existing wwwroot from API if it exists
    rm -rf $(Build.ArtifactStagingDirectory)/api/wwwroot
    
    # Copy Blazor client wwwroot to API
    cp -r $(Build.ArtifactStagingDirectory)/client/wwwroot $(Build.ArtifactStagingDirectory)/api/
    
    echo "=== Integration complete ==="
    echo "API directory contents:"
    ls -la $(Build.ArtifactStagingDirectory)/api/ | head -10
    
    echo "Blazor files in wwwroot:"
    ls -la $(Build.ArtifactStagingDirectory)/api/wwwroot/ | head -10
    
    echo "Critical Blazor files:"
    ls -la $(Build.ArtifactStagingDirectory)/api/wwwroot/_framework/ | head -10
    
    echo "Checking for index.html:"
    ls -la $(Build.ArtifactStagingDirectory)/api/wwwroot/index.html || echo "❌ index.html missing!"
    
    echo "Checking for blazor.webassembly.js:"
    ls -la $(Build.ArtifactStagingDirectory)/api/wwwroot/_framework/blazor.webassembly.js || echo "❌ blazor.webassembly.js missing!"
    
    # Check total size
    echo "Total deployment size:"
    du -sh $(Build.ArtifactStagingDirectory)/api/
  displayName: 'Integrate Blazor with API'

# Deploy to Azure App Service with timeout
- task: AzureWebApp@1
  displayName: 'Deploy to Azure App Service'
  timeoutInMinutes: 10
  inputs:
    azureSubscription: 'CampusConnect-ServiceConnection'
    appType: 'webAppLinux'
    appName: 'CampusConnect'
    package: '$(Build.ArtifactStagingDirectory)/api'
    runtimeStack: 'DOTNETCORE|8.0'
    deploymentMethod: 'auto'
    enableCustomDeployment: true
    removeAdditionalFilesFlag: true