# CampusConnect - Blazor WASM + Controllers API
# Deploys to Azure App Service (Linux, .NET 8)

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  resourceGroupName: 'Software-Tools-Project'

steps:
# Install .NET 8 SDK
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'

# Restore dependencies
- script: |
    dotnet restore
  displayName: 'Restore dependencies'

# Build and publish - Use a simpler approach
- script: |
    echo "Building API and Client together..."
    dotnet publish ./api -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/api-publish
    dotnet publish ./client -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/client-publish
    
    echo "=== API Publish Structure ==="
    find $(Build.ArtifactStagingDirectory)/api-publish -type f | head -15
    
    echo "=== Client Publish Structure ==="
    find $(Build.ArtifactStagingDirectory)/client-publish -type f | head -15
    
    echo "=== Looking for Blazor WASM files ==="
    find $(Build.ArtifactStagingDirectory)/client-publish -name "*.wasm" -o -name "blazor.webassembly.js" -o -name "*.dll"
  displayName: 'Build and Publish Both Projects'

# Integrate Blazor into API
- script: |
    echo "=== Starting Blazor Integration ==="
    
    # Create the final publish directory
    mkdir -p $(Build.ArtifactStagingDirectory)/final-publish
    
    # Copy API files first
    cp -r $(Build.ArtifactStagingDirectory)/api-publish/* $(Build.ArtifactStagingDirectory)/final-publish/
    
    # Now integrate the COMPLETE Blazor WASM publish output
    if [ -d "$(Build.ArtifactStagingDirectory)/client-publish/wwwroot" ]; then
        echo "Found client wwwroot, merging with API wwwroot..."
        
        # Remove API's wwwroot if it exists
        rm -rf $(Build.ArtifactStagingDirectory)/final-publish/wwwroot
        
        # Copy the entire client publish wwwroot (this includes _framework with all assemblies)
        cp -r $(Build.ArtifactStagingDirectory)/client-publish/wwwroot $(Build.ArtifactStagingDirectory)/final-publish/
        
        echo "=== Verifying Critical Blazor Files ==="
        echo "Checking for _framework directory:"
        ls -la $(Build.ArtifactStagingDirectory)/final-publish/wwwroot/_framework/ | head -10
        
        echo "Checking for .dat files:"
        find $(Build.ArtifactStagingDirectory)/final-publish/wwwroot/_framework -name "*.dat" | head -5
        
        echo "Checking for .wasm files:"
        find $(Build.ArtifactStagingDirectory)/final-publish/wwwroot/_framework -name "*.wasm" | head -5
        
        echo "Checking for blazor.webassembly.js:"
        ls -la $(Build.ArtifactStagingDirectory)/final-publish/wwwroot/_framework/blazor.webassembly.js
        
    else
        echo "ERROR: No client wwwroot found!"
        exit 1
    fi
    
    echo "=== Final Structure ==="
    ls -la $(Build.ArtifactStagingDirectory)/final-publish/
    echo "Final wwwroot size:"
    du -sh $(Build.ArtifactStagingDirectory)/final-publish/wwwroot/
  displayName: 'Integrate Blazor Client Files (Complete)'

# Publish artifact
- task: PublishPipelineArtifact@1
  displayName: 'Publish deployment artifact'
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/final-publish'
    artifactName: 'drop'

# Deploy to Azure App Service
- task: AzureWebApp@1
  displayName: 'Deploy to Azure App Service'
  timeoutInMinutes: 10
  inputs:
    azureSubscription: 'CampusConnect-ServiceConnection'
    appName: 'CampusConnect'
    appType: 'webAppLinux'
    package: '$(Build.ArtifactStagingDirectory)/final-publish'
    runtimeStack: 'DOTNETCORE|8.0'
    deploymentMethod: 'runFromPackage'