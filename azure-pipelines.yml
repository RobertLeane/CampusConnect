# Azure Static Web Apps - CampusConnect
# Build and deploy Blazor WebAssembly client and Azure Functions API

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: 'Release'

steps:
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'

# Build and test the Blazor client
- script: |
    dotnet restore ./client
    dotnet build ./client -c $(buildConfiguration) --no-restore
  displayName: 'Build Blazor client'

# Build the Azure Functions API
- script: |
    dotnet restore ./api
    dotnet build ./api -c $(buildConfiguration) --no-restore
  displayName: 'Build Azure Functions API'

# Deploy to Azure Static Web Apps
- task: AzureStaticWebApp@0
  displayName: 'Deploy to Azure Static Web Apps'
  inputs:
    app_location: 'client'
    output_location: 'wwwroot'
    api_location: 'api'
    azure_static_web_apps_api_token: '$(SWA_TOKEN)'
