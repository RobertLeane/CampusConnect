# Azure Static Web Apps - CampusConnect
# Build and deploy Blazor WebAssembly client and Azure Functions API

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  staticWebAppName: 'CampusConnectSWA'
  resourceGroup: 'DevOpsTestGroup'

steps:
# Install .NET 8 SDK
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'

# Build and publish the Blazor client
- script: |
    dotnet restore ./client
    dotnet publish ./client -c $(buildConfiguration) -o ./client-output
  displayName: 'Build and Publish Blazor WebAssembly client'

# Build the Azure Functions API
- script: |
    dotnet restore ./api
    dotnet build ./api -c $(buildConfiguration)
  displayName: 'Build Azure Functions API'

# Install Node.js and SWA CLI
- task: NodeTool@0
  displayName: 'Install Node.js'
  inputs:
    versionSpec: '18.x'

- script: |
    npm install -g @azure/static-web-apps-cli
  displayName: 'Install SWA CLI'

# Deploy to Azure Static Web Apps using Azure CLI and SWA CLI
- task: AzureCLI@2
  displayName: 'Deploy to Azure Static Web Apps'
  inputs:
    azureSubscription: 'Azure subscription 1(bd556404-fea5-48ad-b339-9988df969ee4)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      deploymentToken=$(az staticwebapp secrets list --name "$(staticWebAppName)" --resource-group "$(resourceGroup)" --query "properties.apiKey" -o tsv)
      swa deploy ./client-output/wwwroot --api-location ./api --deployment-token $deploymentToken --env production
