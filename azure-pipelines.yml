# Azure Static Web Apps - CampusConnect
# Build and deploy Blazor WebAssembly client and Azure Functions API

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

steps:
# Install .NET 8 SDK
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'

# Restore and build the Blazor client
- script: |
    dotnet restore ./client
    dotnet publish ./client -c $(buildConfiguration) --no-restore -o ./client-publish
  displayName: 'Build and Publish Blazor WebAssembly client'

# Restore and build the Azure Functions API
- script: |
    dotnet restore ./api
    dotnet build ./api -c $(buildConfiguration) --no-restore
  displayName: 'Build Azure Functions API'

# Deploy to Azure Static Web Apps
- task: AzureStaticWebApp@0
  displayName: 'Deploy to Azure Static Web Apps'
  inputs:
    app_location: './client-publish/wwwroot'
    api_location: './api'
    output_location: ''
    azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APPS_API_TOKEN)'
