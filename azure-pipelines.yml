# CampusConnect - Blazor WASM + Controllers API
# Deploys to Azure App Service (Linux, .NET 8)

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  resourceGroupName: 'Software-Tools-Project'

steps:
# Install .NET 8 SDK
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'

# Restore dependencies
- script: |
    dotnet restore
  displayName: 'Restore dependencies'

# Build and publish the ASP.NET Core Web API (Server)
- script: |
    dotnet publish ./api -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/publish
  displayName: 'Build and Publish API (Controllers)'

# Build the Blazor WebAssembly Client
- script: |
    dotnet publish ./client -c $(buildConfiguration) -o ./client-publish
  displayName: 'Build Blazor WebAssembly Client'

# Copy Blazor client files into server's wwwroot
- script: |
    echo "=== Debugging Blazor Client Integration ==="
    echo "Client-publish directory structure:"
    find ./client-publish -type f | head -20
    echo ""
    echo "Looking for wwwroot in client-publish:"
    find ./client-publish -name "wwwroot" -type d
    echo ""
    echo "API publish directory before integration:"
    ls -la $(Build.ArtifactStagingDirectory)/publish/
    echo ""
    
    # Remove existing wwwroot if any
    rm -rf $(Build.ArtifactStagingDirectory)/publish/wwwroot
    
    # The correct path for Blazor WASM published files
    if [ -d "./client-publish/wwwroot" ]; then
        echo "Found wwwroot in client-publish, copying..."
        cp -a ./client-publish/wwwroot $(Build.ArtifactStagingDirectory)/publish/
    else
        echo "wwwroot not found in client-publish, checking for dist or other patterns..."
        find ./client-publish -name "*.js" -o -name "*.wasm" -o -name "*.json" | head -10
    fi
    
    echo ""
    echo "API publish directory after integration:"
    ls -la $(Build.ArtifactStagingDirectory)/publish/
    if [ -d "$(Build.ArtifactStagingDirectory)/publish/wwwroot" ]; then
        echo "wwwroot contents:"
        ls -la $(Build.ArtifactStagingDirectory)/publish/wwwroot/ | head -10
    fi
  displayName: 'Integrate Blazor Client into API wwwroot (with debugging)'

# Publish artifact
- task: PublishPipelineArtifact@1
  displayName: 'Publish deployment artifact'
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/publish'
    artifactName: 'drop'

# Deploy to Azure App Service
- task: AzureWebApp@1
  displayName: 'Deploy to Azure App Service'
  timeoutInMinutes: 10
  inputs:
    azureSubscription: 'CampusConnect-ServiceConnection'
    appName: 'CampusConnect'
    appType: 'webAppLinux'
    package: '$(Build.ArtifactStagingDirectory)/publish'
    runtimeStack: 'DOTNETCORE|8.0'
    deploymentMethod: 'runFromPackage'